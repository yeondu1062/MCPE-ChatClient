<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minecraft Chat Client</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background: #abc1d1;
      overflow: hidden;
      transition: background 0.3s;
    }

    .dark-mode {
      background: #1e1e1e;
    }

    .header, #chat, .message, #inputArea, #messageInput {
      transition: all 0.3s ease;
    }

    .header {
      background: inherit;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .channel-name {
      font-size: 15px;
      font-weight: bold;
    }

    .icon-button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 19px;
      opacity: 0.8;
      color: #000;
    }

    .icon-button:hover { opacity: 1; }

    .dark-mode .icon-button,
    .dark-mode .channel-name {
      color: #fff;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: inherit;
      position: fixed;
      top: 60px;
      bottom: 100px;
      left: 0;
      right: 0;
    }

    .message {
      background: #fff;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 14px;
      border-radius: 12px;
      max-width: 70%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      clear: both;
    }

    .message.me {
      background: #fee500;
      margin-left: auto;
    }

    .dark-mode .message {
      background: #2d2d2d;
      color: #fff;
      box-shadow: 0 1px 2px rgba(255,255,255,0.05);
    }

    .dark-mode .message.me {
      background: #3a3a3a;
    }

    .system-message {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin: 8px 0;
    }

    .dark-mode .system-message {
      color: #999;
    }

    #inputArea {
      height: 100px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border-top: 1px solid #e6e6e6;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 21px;
      font-size: 14px;
      background: #f8f8f8;
      color: #000;
    }

    #messageInput::placeholder {
      color: #999;
    }

    .dark-mode #inputArea {
      background: #2d2d2d;
      border-top: 5px solid #3a3a3a;
    }

    .dark-mode #messageInput {
      background: #3a3a3a;
      color: #fff;
    }

    .dark-mode #messageInput::placeholder {
      color: #888;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }

    #sendButton { display: none; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <i class="fas fa-user-circle" style="font-size:36px; color:#4a90e2;"></i>
      <span class="channel-name">ChatClient</span>
    </div>
    <div class="header-right">
      <button class="icon-button" id="darkModeToggle"><i class="fas fa-moon"></i></button>
    </div>
  </div>
  <div id="chat"></div>
  <div id="inputArea">
    <input type="text" id="messageInput" placeholder="메시지를 입력하세요" />
    <button id="sendButton">전송</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const body = document.body;
    const darkToggle = document.getElementById('darkModeToggle');
    const icon = darkToggle.querySelector('i');

    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      icon.classList.replace('fa-moon', 'fa-sun');
    }

    darkToggle.onclick = () => {
      body.classList.toggle('dark-mode');
      const dark = body.classList.contains('dark-mode');
      icon.classList.replace(dark ? 'fa-moon' : 'fa-sun', dark ? 'fa-sun' : 'fa-moon');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    };

    const chatDiv = document.getElementById('chat');
    const input = document.getElementById('messageInput');
    const socket = io();

    socket.on('chat_message', (msg) => {
      const div = document.createElement('div');
      div.className = 'message';
      if (msg.startsWith('[me]')) {
        div.classList.add('me');
        msg = msg.slice(4);
      }
      div.textContent = msg;
      chatDiv.appendChild(div);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    });

    const send = () => {
      const msg = input.value.trim();
      if (msg) {
        socket.emit('send_chat_message', msg);
        input.value = '';
      }
    };

    document.getElementById('sendButton').onclick = send;
    input.addEventListener('keypress', e => e.key === 'Enter' && send());
  </script>
</body>
</html>
